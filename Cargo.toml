[package]
name = "wasm-triangle"
version = "0.1.0"
edition = "2021"
description = "A simple Rust project to draw a triangle using WebAssembly and Canvas API"
authors = ["<邱张华(qiuzhanghua@msn.com)>"]
license = "MIT"
repository = "https://github.com/qiuzhanghua/wasm-triangle"

[lib]
# 这将让编译器生成一个C风格的动态库，这是WASM模块的标准格式
crate-type = ["cdylib"]

[dependencies]
# wasm-bindgen 不可或缺，它是Rust与JavaScript之间的桥梁
wasm-bindgen = "0.2"

# web-sys 提供了访问浏览器Web API的能力，这里我们需要Canvas相关的特性
[dependencies.web-sys]
version = "0.3"
features = [
    "CanvasRenderingContext2d",    # 使用Canvas 2D渲染上下文
    "Document",                    # 操作DOM文档对象
    "HtmlCanvasElement",           # 获取和操作Canvas元素
    "Window",                      # 获取全局window对象
]